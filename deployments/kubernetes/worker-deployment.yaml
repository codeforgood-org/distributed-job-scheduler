apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: distributed-scheduler
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: distributed-scheduler
      component: worker
  template:
    metadata:
      labels:
        app: distributed-scheduler
        component: worker
    spec:
      containers:
        - name: worker
          image: distributed-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SCHEDULER_ADDR
              value: "scheduler-0.scheduler:7001"
          command:
            - /app/worker
            - --worker-id=$(POD_NAME)
            - --scheduler=$(SCHEDULER_ADDR)
            - --max-concurrency=4
            - --log-level=info
            - --log-format=json
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
